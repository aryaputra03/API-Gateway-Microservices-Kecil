x-product-service: &product-service
  build: ./product-service
  image: microservices/product-service
  env_file: ./product-service/.env
  restart: unless-stopped

services:
  auth-service:
    build: ./auth-service
    image: microservices/auth-service
    env_file: ./auth-service/.env
    environment:
      PORT: "4001"
    restart: unless-stopped

  product-1:
    <<: *product-service
    environment:
      PORT: "4002"
      KAFKA_BROKERS: kafka:9092
      OUTBOX_RELAY_ENABLED: "true" # << HANYA product-1 yang menerbitkan outbox
      OUTBOX_POLL_MS: "1000"

  product-2:
    <<: *product-service
    environment:
      PORT: "4002"
      KAFKA_BROKERS: kafka:9092
      OUTBOX_RELAY_ENABLED: "false" # << product-2 tetap konsumsi order.created, TIDAK menerbitkan outbox
      OUTBOX_POLL_MS: "1000"

  order-service:
    build: ./order-service
    image: microservices/order-service
    env_file: ./order-service/.env
    environment:
      PORT: "4004"
      PRODUCT_SERVICE_URL: http://gateway:8081
      KAFKA_BROKERS: kafka:9092
      ORDER_FLOW: sync # << ganti ke "event" manual kalau mau uji alur baru
      OUTBOX_POLL_MS: "1000"
    restart: unless-stopped

  gateway:
    image: nginx:1.28.0-alpine
    command:
      [
        "nginx",
        "-c",
        "/etc/nginx/custom/nginx.docker.conf",
        "-g",
        "daemon off;",
      ]
    ports:
      - "80:80"
    volumes:
      - ./gateway:/etc/nginx/custom:ro
    depends_on:
      auth-service:
        condition: service_healthy
      product-1:
        condition: service_healthy
      product-2:
        condition: service_healthy
      order-service:
        condition: service_healthy
    restart: unless-stopped

  # ===================== BARU: Kafka =====================
  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:29092:29092" # hanya untuk mode manual di host, tidak dipublikasikan ke jaringan
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092",
        ]
      interval: 10s
      retries: 10
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    command:
      [
        "/bin/sh",
        "-c",
        "for t in order.created stock.reserved stock.rejected product.events; do /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1; /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t.dlq --partitions 1 --replication-factor 1; done",
      ]
    # Container ini SENGAJA berstatus "Exited (0)" setelah selesai -- bukan error.
    # Tugasnya cuma bikin topic sekali lalu mati.

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:8088:8080" # alat dev, jangan dibuka ke jaringan publik
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

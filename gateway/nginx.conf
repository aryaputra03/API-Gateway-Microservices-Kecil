worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # Format log yang mencatat instance mana yang melayani tiap request
    log_format gateway '$remote_addr [$time_local] "$request" $status '
                       'rt=$request_time up=$upstream_addr ust=$upstream_status';
    access_log logs/access.log gateway;

    # Rate limiting: 10 request/detik per alamat IP client
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    map $http_x_request_id $req_id {
    default   $http_x_request_id;
    ""        $request_id;
}

    upstream auth_service {
        server 127.0.0.1:4001;
    }

    upstream product_service {
        # default: round-robin. max_fails/fail_timeout = health check pasif
        server 127.0.0.1:4002 max_fails=2 fail_timeout=10s;
        server 127.0.0.1:4003 max_fails=2 fail_timeout=10s;
    }

    upstream order_service {
        server 127.0.0.1:4004;
    }

    # ===================== GERBANG PUBLIK (port 80) =====================
    server {
        listen 80;
        server_name localhost;

        limit_req zone=api_limit burst=20 nodelay;

        proxy_connect_timeout 3s;
        proxy_read_timeout    15s;

        location = /health {
            default_type application/json;
            return 200 '{"success":true,"service":"gateway","status":"ok"}';
        }

        location /api/auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header Authorization     $http_authorization;
            proxy_set_header X-Request-Id      $req_id;
        }

        location /api/products {
            proxy_pass http://product_service/products;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header Authorization     $http_authorization;
            proxy_set_header X-Request-Id      $req_id;

            # Jika satu instance gagal tersambung/timeout, coba instance lain
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
        }

        location /api/orders {
            proxy_pass http://order_service/orders;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header Authorization     $http_authorization;
            proxy_set_header X-Request-Id      $req_id;
        }

        location / {
            default_type application/json;
            return 404 '{"success":false,"message":"Route tidak ditemukan","code":"ROUTE_NOT_FOUND"}';
        }

        error_page 429 = @too_many_requests;
        error_page 502 = @bad_gateway;
        error_page 504 = @gateway_timeout;

        location @too_many_requests {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"success":false,"message":"Terlalu banyak request, coba lagi sebentar lagi","code":"RATE_LIMITED"}';
        }

        location @bad_gateway {
            default_type application/json;
            return 502 '{"success":false,"message":"Layanan tujuan tidak tersedia","code":"BAD_GATEWAY"}';
        }

        location @gateway_timeout {
            default_type application/json;
            return 504 '{"success":false,"message":"Layanan tujuan tidak merespons tepat waktu","code":"GATEWAY_TIMEOUT"}';
        }
    }

    # ============ LISTENER INTERNAL (hanya dari mesin ini, Langkah 5) ============
    server {
        listen 127.0.0.1:8081;
        server_name localhost;

        location /internal/ {
            proxy_pass http://product_service;     # tanpa URI: path asli diteruskan apa adanya
            proxy_set_header Host              $host;
            proxy_set_header Authorization     $http_authorization;

            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            proxy_set_header X-Request-Id      $req_id;
        }

        location / {
            default_type application/json;
            return 404 '{"success":false,"message":"Route tidak ditemukan","code":"ROUTE_NOT_FOUND"}';
        }

        error_page 502 = @bad_gateway;
        error_page 504 = @gateway_timeout;

        location @bad_gateway {
            default_type application/json;
            return 502 '{"success":false,"message":"Layanan tujuan tidak tersedia","code":"BAD_GATEWAY"}';
        }

        location @gateway_timeout {
            default_type application/json;
            return 504 '{"success":false,"message":"Layanan tujuan tidak merespons tepat waktu","code":"GATEWAY_TIMEOUT"}';
        }
    }
}
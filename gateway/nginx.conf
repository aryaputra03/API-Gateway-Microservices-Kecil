worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server_tokens off;   # sembunyikan versi Nginx dari response

    # Upstream = daftar tujuan untuk tiap service
    upstream auth_service {
        server 127.0.0.1:4001;
    }

    upstream product_service {
        server 127.0.0.1:4002;
        # Fase 5: tambahkan "server 127.0.0.1:4003;" di sini
    }

    upstream order_service {
        server 127.0.0.1:4004;
    }

    server {
        listen 80;
        server_name localhost;

        # Jangan biarkan gateway menunggu service yang mati/menggantung terlalu lama
        proxy_connect_timeout 3s;
        proxy_read_timeout    15s;

        # Cek kesehatan gateway itu sendiri
        location = /health {
            default_type application/json;
            return 200 '{"success":true,"service":"gateway","status":"ok"}';
        }

        location /api/auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header Authorization     $http_authorization;
        }

        location /api/products {
            proxy_pass http://product_service/products;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header Authorization     $http_authorization;
        }

        location /api/orders {
            proxy_pass http://order_service/orders;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header Authorization     $http_authorization;
        }

        # Semua path lain (termasuk /internal/*) -> 404 berformat JSON
        location / {
            default_type application/json;
            return 404 '{"success":false,"message":"Route tidak ditemukan","code":"ROUTE_NOT_FOUND"}';
        }

        # Error yang dibuat Nginx sendiri saat service tujuan mati/lambat
        error_page 502 = @bad_gateway;
        error_page 504 = @gateway_timeout;

        location @bad_gateway {
            default_type application/json;
            return 502 '{"success":false,"message":"Layanan tujuan tidak tersedia","code":"BAD_GATEWAY"}';
        }

        location @gateway_timeout {
            default_type application/json;
            return 504 '{"success":false,"message":"Layanan tujuan tidak merespons tepat waktu","code":"GATEWAY_TIMEOUT"}';
        }
    }
}